<body>
  <a class="skip" href="#main">跳到指令目录</a>
  <aside class="sidebar">
    <a class="brand" href="#main" aria-label="Bakahelp 首页"><img class="brand-mark" src="BAKAHELP_BRAND_IMAGE" alt=""><span>Bakahelp<span class="brand-note">Baka666Bot 使用指南</span></span></a>
    <nav id="categories" aria-label="功能分类"></nav>
    <div class="side-footer">猫猫虫小窝<span>指令速查</span></div>
  </aside>
  <main id="main">
    <section class="intro" aria-labelledby="title"><div><h1 id="title">Baka666Bot 指令目录</h1><p>搜索触发方式、参数和功能说明。</p></div><img class="project-picture" src="BAKAHELP_BRAND_IMAGE" alt=""></section>
    <section class="finder" aria-label="查找功能">
      <label class="search" for="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input id="search" type="search" aria-label="搜索指令、功能、别名或插件" placeholder="搜索指令、功能、别名或插件…" autocomplete="off"><kbd aria-hidden="true">/</kbd></label>
      <div class="quick"><button data-query="谱面">谱面</button><button data-query="成绩">成绩</button><button data-query="转换">转换</button><button data-query="表情包">表情包</button></div>
      <div class="filters"><label>插件<select id="plugin"><option value="">全部插件</option></select></label><label>触发方式<select id="kind"><option value="">全部方式</option></select></label><label class="check"><input id="documented" type="checkbox">只看有使用说明</label><button id="reset" class="reset">重置筛选</button></div>
    </section>
    <section aria-labelledby="results-title"><div class="result-heading"><h2 id="results-title">全部功能</h2><span id="count" role="status" aria-live="polite"></span></div>
      <p class="table-hint"><code>&lt;参数&gt;</code> 必填，<code>[参数]</code> 可选。展开表情包分组可查看全部触发词。</p>
      <div id="table-scroll" class="table-scroll" role="region" aria-label="指令表格，可横向滚动" tabindex="0"><table class="command-table"><caption class="sr-only">指令触发方式、参数和功能说明</caption><colgroup><col class="trigger-col"><col class="arguments-col"><col class="function-col"></colgroup><thead><tr><th scope="col">触发名或触发语义</th><th scope="col">参数</th><th scope="col">功能说明</th></tr></thead><tbody id="results"></tbody></table></div>
      <div id="empty" hidden><h3>暂时没找到这个功能</h3><p>换一个关键词，或重置筛选后再试试。</p><button id="empty-reset">查看全部功能</button></div><button id="more" hidden>显示更多功能</button>
    </section>
    <section class="guide" id="reading-guide"><h2>参数与触发</h2><p><code>&lt;参数&gt;</code> 为必填，<code>[参数]</code> 为可选。规则触发和群事件会用自然语言说明触发条件。</p></section>
    <footer><span>Bakahelp / Baka666Bot</span><a href="#main">回到顶部</a></footer>
  </main>
  <aside id="floating-index" class="floating-index" aria-label="悬浮插件索引">
    <button id="index-toggle" class="index-toggle" type="button" aria-expanded="false" aria-controls="index-panel"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M3 6h1M3 12h1M3 18h1"/></svg><span>索引</span></button>
    <div id="index-panel" class="index-panel" hidden><div class="index-heading"><h2>快速定位</h2><button id="index-close" type="button" aria-label="关闭索引"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 18 6 6"/></svg></button></div><div id="index-links"></div><button id="index-top" type="button">回到搜索</button></div>
  </aside>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript><p>请启用 JavaScript 使用搜索和指令目录，也可以查看同目录中的 catalog.json。</p></noscript>
  <script id="catalog" type="application/json">BAKAHELP_DATA_PLACEHOLDER</script>
  <script>/* BAKAHELP_SCRIPT */</script>
</body>
