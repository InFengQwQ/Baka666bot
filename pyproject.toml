[project]
name = "baka666bot"
version = "0.1.0"
description = "Baka666Bot based on NoneBot2"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "nonebot2[aiohttp,fastapi]>=2.5.0",
    "nonebot-adapter-onebot>=2.4.3",
    "nonebot-adapter-discord>=1.1.9",
    "nonebot-adapter-telegram>=0.1.0b20",
    "anyio>=4.0.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "nonebot-plugin-alconna>=0.62.0",
    "nonebot-plugin-waiter>=0.8.1",
    "nonebot-plugin-arcaea-sticker>=0.4.6",
    "nonebot_plugin_memes>=0.8.1",
    "nonebot-plugin-capoo>=1.0.0",
    "nonebot-plugin-add-friends>=0.1.5",
    "nonebot-plugin-osumania-toolkit>=1.1.3,<1.2",
    "nonebot-plugin-blacklist>=1.4.3",
    "nonebot-plugin-htmlrender==0.7.2",
    "nonebot-plugin-apscheduler>=0.5.0,<0.6",
    "nonebot-plugin-session>=0.3.2,<0.4",
    "playwright==1.60.0",
    "blackboxprotobuf>=1.0.1,<2",
    "osu-tools-py>=0.1.7,<0.2",
    "beautifulsoup4>=4.15.0,<5",
    "expiringdict>=1.2.2,<2",
    "pydub>=0.25.1,<0.26",
    "rapidfuzz>=3.14.0,<4",
    "requests>=2.34.0,<3",
    "rhythmgame-tools>=2.0.0,<3",
    "rosu-pp-py>=4.0.0,<5",
    "unidecode>=1.4.0,<2",
    "zhconv>=1.4.0,<2",
]

[tool.uv]
override-dependencies = ["protobuf==7.36.2"]

[tool.nonebot]
adapters = [
    { name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11" }
]
plugins = ["nonebot_plugin_arcaea_sticker", "nonebot_plugin_memes", "nonebot_plugin_capoo", "nonebot_plugin_add_friends", "nonebot_plugin_blacklist"]
plugin_dirs = ["src/plugins", "src/plugins/nonebot-plugin-for-osumania4k"]
builtin_plugins = ["echo"]
