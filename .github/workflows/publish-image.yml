name: Publish image

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bot:
        description: Publish the bot image
        type: boolean
        default: true
      napcat:
        description: Publish the pinned NapCat image as well
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  NAPCAT_RELEASE: napcat-4.18.42

jobs:
  bot:
    if: github.event_name == 'push' || inputs.bot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: astral-sh/setup-uv@v5

      - name: Lint
        run: |
          uv sync --frozen --only-group dev
          uv run --no-sync ruff check

      - name: Image name
        id: name
        run: |
          owner="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          repo="$(echo "${GITHUB_REPOSITORY#*/}" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner}/${repo}" >> "$GITHUB_OUTPUT"

      - name: Version
        id: version
        run: echo "value=$(date -u +%Y.%m.%d)-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:${{ steps.version.outputs.value }}
            ${{ steps.name.outputs.image }}:latest
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  napcat:
    if: inputs.napcat
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        id: name
        run: |
          owner="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          repo="$(echo "${GITHUB_REPOSITORY#*/}" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner}/${repo}-napcat" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Load and push NapCat
        env:
          IMAGE: ${{ steps.name.outputs.image }}
        run: |
          set -euo pipefail
          gh release download "$NAPCAT_RELEASE" --pattern 'napcat-docker-*.tar' --dir "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"
          sha256sum -c "$GITHUB_WORKSPACE/docker/napcat-image.sha256"
          docker load -i napcat-docker-*.tar
          version="${NAPCAT_RELEASE#napcat-}"
          docker tag "mlikiowa/napcat-docker:v${version}" "$IMAGE:${version}"
          docker push "$IMAGE:${version}"
